<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blazor component playground</title>
    <base href="/" />
    <style>
      :root {
        --bg: #12141a;
        --panel: #1b1e27;
        --border: #2c3040;
        --text: #e6e8ee;
        --muted: #8b93a7;
        --accent: #8b7cf6;
        --error: #ff6b81;
        --warning: #f0b429;
        --ok: #3ddc97;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }
      header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      h1 { font-size: 16px; margin: 0; font-weight: 600; }
      .subtitle { color: var(--muted); font-size: 13px; }
      #status {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        padding: 3px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        white-space: nowrap;
      }
      #status.ready { color: var(--ok); border-color: #2f6b52; }
      #status.loading { color: var(--warning); border-color: #6b5726; }
      #status.failed { color: var(--error); border-color: #6b2f38; }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        min-height: 0;
      }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      section {
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        min-height: 0;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      #code {
        flex: 1;
        margin: 0;
        padding: 12px;
        border: 0;
        background: transparent;
        color: var(--text);
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        min-height: 280px;
        resize: none;
        outline: none;
        tab-size: 4;
        white-space: pre;
        overflow: auto;
      }
      #stage { flex: 1; padding: 16px; overflow: auto; }
      #stage button {
        background: var(--accent);
        color: #0d0f14;
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #diagnostics {
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--error);
        max-height: 140px;
        overflow: auto;
        white-space: pre-wrap;
      }
      #diagnostics:empty { display: none; }
      footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      select, #root {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 9px 10px;
        font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        outline: none;
      }
      #root { width: 120px; }
      #render {
        background: var(--accent);
        color: #0d0f14;
        border: 0;
        border-radius: 8px;
        padding: 10px 22px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #render:disabled { opacity: 0.5; cursor: default; }
      .hint { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Blazor component playground</h1>
      <span class="subtitle"
        >write a component in Razor or C# — it is compiled in this page and rendered on the real
        Blazor renderer, no server</span
      >
      <span id="status">starting…</span>
    </header>

    <main>
      <section>
        <div class="section-head"><span id="file-name">Component.razor</span></div>
        <textarea id="code" spellcheck="false"></textarea>
      </section>
      <section>
        <div class="section-head"><span>Rendered component</span></div>
        <div id="stage">
          <!-- The rendered component mounts here. -->
          <div id="blazor-app"></div>
        </div>
        <pre id="diagnostics"></pre>
      </section>
    </main>

    <footer>
      <button id="render" disabled>Render</button>
      <select id="language">
        <option value="razor">Razor</option>
        <option value="csharp">C#</option>
      </select>
      <label class="hint" for="root">component name</label>
      <input id="root" value="App" autocomplete="off" spellcheck="false" />
      <span class="hint">Ctrl/Cmd + Enter to render</span>
    </footer>

    <script src="blazor-wasm.js"></script>
    <script>
      var SAMPLES = {
        razor: [
          '<h1>Hello from Razor</h1>',
          '',
          '<p>You clicked <strong>@count</strong> times.</p>',
          '',
          '<button @onclick="Increment">Click me</button>',
          '',
          '@code {',
          '    int count;',
          '',
          '    void Increment() => count++;',
          '}',
          '',
        ].join('\n'),

        csharp: [
          'using System;',
          'using Microsoft.AspNetCore.Components;',
          'using Microsoft.AspNetCore.Components.Rendering;',
          '',
          '// A child component, used by the root below.',
          'public class Counter : ComponentBase',
          '{',
          '    int count;',
          '',
          '    protected override void BuildRenderTree(RenderTreeBuilder builder)',
          '    {',
          '        builder.OpenElement(0, "button");',
          '        builder.AddAttribute(1, "onclick",',
          '            EventCallback.Factory.Create<Microsoft.AspNetCore.Components.Web.MouseEventArgs>(this, () => count++));',
          '        builder.AddContent(2, $"Clicked {count} times");',
          '        builder.CloseElement();',
          '    }',
          '}',
          '',
          'public class App : ComponentBase',
          '{',
          '    protected override void BuildRenderTree(RenderTreeBuilder builder)',
          '    {',
          '        builder.OpenElement(0, "div");',
          '        builder.AddAttribute(1, "style", "text-align:center; font-family:sans-serif");',
          '        builder.OpenElement(2, "h1");',
          '        builder.AddContent(3, "Hello from C#");',
          '        builder.CloseElement();',
          '        builder.OpenComponent<Counter>(4);',
          '        builder.CloseComponent();',
          '        builder.CloseElement();',
          '    }',
          '}',
          '',
        ].join('\n'),
      };

      var FILE_NAME = { razor: 'Component.razor', csharp: 'Components.cs' };

      var statusEl = document.getElementById('status');
      var renderButton = document.getElementById('render');
      var codeEl = document.getElementById('code');
      var rootEl = document.getElementById('root');
      var languageEl = document.getElementById('language');
      var fileNameEl = document.getElementById('file-name');
      var diagnosticsEl = document.getElementById('diagnostics');

      codeEl.value = SAMPLES[languageEl.value];

      function setStatus(text, className) {
        statusEl.textContent = text;
        statusEl.className = className || '';
      }

      // The page itself uses the same loader the package ships.
      var runner = BlazorRunner.create({
        onProgress: function (count) {
          setStatus('downloading runtime… (' + count + ' files)', 'loading');
        },
      });

      function compile(source, componentName) {
        return languageEl.value === 'razor'
          ? runner.renderRazor(source, componentName)
          : runner.render(source, componentName);
      }

      async function renderComponent() {
        renderButton.disabled = true;
        diagnosticsEl.textContent = '';
        var started = performance.now();
        try {
          var result = await compile(codeEl.value, rootEl.value.trim());
          var elapsed = Math.round(performance.now() - started);

          if (result.success) {
            setStatus('rendered ' + result.type + ' — ' + elapsed + ' ms', 'ready');
          } else {
            diagnosticsEl.textContent = (result.errors || [])
              .map(function (e) {
                return e.id + ': ' + e.message + (e.line ? ' (line ' + e.line + ')' : '');
              })
              .join('\n');
            setStatus('failed — ' + elapsed + ' ms', 'failed');
          }
        } catch (err) {
          diagnosticsEl.textContent = String((err && err.message) || err);
          setStatus('failed', 'failed');
          console.error(err);
        } finally {
          renderButton.disabled = false;
        }
      }

      languageEl.addEventListener('change', function () {
        fileNameEl.textContent = FILE_NAME[languageEl.value];
        codeEl.value = SAMPLES[languageEl.value];
        renderComponent();
      });

      renderButton.addEventListener('click', renderComponent);
      codeEl.addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') renderComponent();
      });

      setStatus('downloading runtime…', 'loading');
      runner.ready().then(
        function () {
          renderButton.disabled = false;
          return renderComponent();
        },
        function (err) {
          setStatus('failed to start', 'failed');
          diagnosticsEl.textContent = String((err && err.message) || err);
        },
      );
    </script>
  </body>
</html>
