<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blazor project playground</title>
    <base href="/" />
    <style>
      :root {
        --bg: #12141a;
        --panel: #1b1e27;
        --border: #2c3040;
        --text: #e6e8ee;
        --muted: #8b93a7;
        --accent: #8b7cf6;
        --error: #ff6b81;
        --warning: #f0b429;
        --ok: #3ddc97;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }
      header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      h1 { font-size: 16px; margin: 0; font-weight: 600; }
      .subtitle { color: var(--muted); font-size: 13px; }
      #status {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        padding: 3px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        white-space: nowrap;
      }
      #status.ready { color: var(--ok); border-color: #2f6b52; }
      #status.loading { color: var(--warning); border-color: #6b5726; }
      #status.failed { color: var(--error); border-color: #6b2f38; }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        min-height: 0;
      }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      section {
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        min-height: 0;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        min-height: 38px;
      }
      .file-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .file-tabs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .tab, .icon-button {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 10px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        cursor: pointer;
      }
      .tab.active { color: var(--text); border-color: var(--accent); }
      .icon-button { padding: 3px 8px; }
      .icon-button:disabled { opacity: 0.4; cursor: default; }
      .route-chip {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 10px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-transform: none;
        letter-spacing: 0;
        cursor: pointer;
      }
      #code {
        flex: 1;
        margin: 0;
        padding: 12px;
        border: 0;
        background: transparent;
        color: var(--text);
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        min-height: 260px;
        resize: none;
        outline: none;
        tab-size: 4;
        white-space: pre;
        overflow: auto;
      }
      #stage { flex: 1; padding: 16px; overflow: auto; }
      #stage button {
        background: var(--accent);
        color: #0d0f14;
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #stage a { color: var(--accent); }
      #diagnostics {
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--error);
        max-height: 140px;
        overflow: auto;
        white-space: pre-wrap;
      }
      #diagnostics:empty { display: none; }
      footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      select, #root {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 9px 10px;
        font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        outline: none;
      }
      #root { width: 120px; }
      #render {
        background: var(--accent);
        color: #0d0f14;
        border: 0;
        border-radius: 8px;
        padding: 10px 22px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #render:disabled { opacity: 0.5; cursor: default; }
      .hint { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Blazor project playground</h1>
      <span class="subtitle"
        >a multi-file project of Razor and C# — compiled in this page, rendered on the real Blazor
        renderer, no server</span
      >
      <span id="status">starting…</span>
    </header>

    <main>
      <section>
        <div class="section-head"><span>Project files</span></div>
        <div class="file-bar">
          <div class="file-tabs" id="file-tabs"></div>
          <button class="icon-button" id="add-file" title="New file">+</button>
          <button class="icon-button" id="remove-file" title="Delete this file">×</button>
        </div>
        <textarea id="code" spellcheck="false"></textarea>
      </section>
      <section>
        <div class="section-head">
          <span>Rendered project</span>
          <span class="file-tabs" id="routes" style="margin-left: auto"></span>
        </div>
        <div id="stage">
          <!-- Whatever the project renders mounts here. -->
          <div id="blazor-app"></div>
        </div>
        <pre id="diagnostics"></pre>
      </section>
    </main>

    <footer>
      <button id="render" disabled>Render</button>
      <select id="mode">
        <option value="razor">Razor project</option>
        <option value="csharp">C# project</option>
      </select>
      <label class="hint" for="root">root component</label>
      <input id="root" value="App" autocomplete="off" spellcheck="false" />
      <span class="hint">Ctrl/Cmd + Enter to render</span>
    </footer>

    <script src="blazor-wasm.js"></script>
    <script>
      var DEFAULT_PROJECTS = {
        razor: {
          files: [
            {
              name: 'App.razor',
              content: `<Router AppAssembly="typeof(App).Assembly">
    <Found Context="routeData">
        <RouteView RouteData="routeData" />
    </Found>
    <NotFound>
        <p>No component matches this route.</p>
    </NotFound>
</Router>
`,
            },
            {
              name: 'Home.razor',
              content: `@page "/"

<h1>Home</h1>

<p>
    A multi-file project: <code>App.razor</code> routes, and each page is its own file that
    declares <code>@page</code>.
</p>

<p><NavLink href="/counter">Go to /counter</NavLink></p>
`,
            },
            {
              name: 'Counter.razor',
              content: `@page "/counter"

<h2>Counter</h2>

<p>You clicked <strong>@count</strong> times.</p>
<button @onclick="Increment">Click me</button>

<p><NavLink href="/">Back home</NavLink></p>

@code {
    int count;

    void Increment() => count++;
}
`,
            },
          ],
        },

        csharp: {
          files: [
            {
              name: 'Components.cs',
              content: `using System;
using Microsoft.AspNetCore.Components;
using Microsoft.AspNetCore.Components.Rendering;
using Microsoft.AspNetCore.Components.Web;

// A component per class; they compile into one assembly, so App can use Counter.
public class Counter : ComponentBase
{
    int count;

    protected override void BuildRenderTree(RenderTreeBuilder builder)
    {
        builder.OpenElement(0, "button");
        builder.AddAttribute(1, "onclick", EventCallback.Factory.Create<MouseEventArgs>(this, () => count++));
        builder.AddContent(2, $"Clicked {count} times");
        builder.CloseElement();
    }
}

public class App : ComponentBase
{
    protected override void BuildRenderTree(RenderTreeBuilder builder)
    {
        builder.OpenElement(0, "div");
        builder.AddAttribute(1, "style", "text-align:center; font-family:sans-serif");

        builder.OpenElement(2, "h1");
        builder.AddContent(3, "A C# project");
        builder.CloseElement();

        builder.OpenComponent<Counter>(4);
        builder.CloseComponent();

        builder.CloseElement();
    }
}
`,
            },
          ],
        },
      };

      var statusEl = document.getElementById('status');
      var renderButton = document.getElementById('render');
      var codeEl = document.getElementById('code');
      var rootEl = document.getElementById('root');
      var modeEl = document.getElementById('mode');
      var tabsEl = document.getElementById('file-tabs');
      var routesEl = document.getElementById('routes');
      var addButton = document.getElementById('add-file');
      var removeButton = document.getElementById('remove-file');
      var diagnosticsEl = document.getElementById('diagnostics');
      var stageEl = document.getElementById('blazor-app');

      var project = clone(DEFAULT_PROJECTS[modeEl.value]);
      var activeFile = 0;

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function setStatus(text, className) {
        statusEl.textContent = text;
        statusEl.className = className || '';
      }

      function saveActiveFile() {
        if (project.files[activeFile]) project.files[activeFile].content = codeEl.value;
      }

      function loadActiveFile() {
        codeEl.value = project.files[activeFile] ? project.files[activeFile].content : '';
      }

      function renderTabs() {
        tabsEl.textContent = '';
        project.files.forEach(function (file, index) {
          var tab = document.createElement('button');
          tab.className = 'tab' + (index === activeFile ? ' active' : '');
          tab.textContent = file.name;
          tab.onclick = function () {
            saveActiveFile();
            activeFile = index;
            loadActiveFile();
            renderTabs();
          };
          tabsEl.appendChild(tab);
        });
        removeButton.disabled = project.files.length <= 1;
      }

      function showRoutes(routes) {
        routesEl.textContent = '';
        (routes || []).forEach(function (route) {
          var chip = document.createElement('button');
          chip.className = 'route-chip';
          chip.textContent = route;
          chip.title = 'Navigate to ' + route;
          chip.onclick = function () {
            renderButton.disabled = true;
            runner.navigateTo(route).then(
              function () {
                renderButton.disabled = false;
              },
              function (err) {
                renderButton.disabled = false;
                diagnosticsEl.textContent = String((err && err.message) || err);
              },
            );
          };
          routesEl.appendChild(chip);
        });
      }

      // The page itself uses the same loader the package ships.
      var runner = BlazorRunner.create({
        onProgress: function (count) {
          setStatus('downloading runtime… (' + count + ' files)', 'loading');
        },
      });

      async function renderProject() {
        renderButton.disabled = true;
        diagnosticsEl.textContent = '';
        saveActiveFile();
        var started = performance.now();
        try {
          var result = await runner.renderProject(clone(project.files), rootEl.value.trim());
          var elapsed = Math.round(performance.now() - started);

          showRoutes(result.routes);

          if (result.success) {
            setStatus('rendered ' + result.type + ' — ' + elapsed + ' ms', 'ready');
          } else {
            diagnosticsEl.textContent = (result.errors || [])
              .map(function (e) {
                return e.id + ': ' + e.message + (e.line ? ' (line ' + e.line + ')' : '');
              })
              .join('\n');
            setStatus('failed — ' + elapsed + ' ms', 'failed');
          }
        } catch (err) {
          diagnosticsEl.textContent = String((err && err.message) || err);
          setStatus('failed', 'failed');
          console.error(err);
        } finally {
          renderButton.disabled = false;
        }
      }

      modeEl.addEventListener('change', function () {
        project = clone(DEFAULT_PROJECTS[modeEl.value]);
        activeFile = 0;
        loadActiveFile();
        renderTabs();
        renderProject();
      });

      addButton.addEventListener('click', function () {
        var name = prompt('File name', 'Page.razor');
        if (!name) return;
        saveActiveFile();
        project.files.push({ name: name, content: name.endsWith('.razor') ? '@page "/' + name.replace(/\.razor$/i, '').toLowerCase() + '"\n\n<h2>' + name.replace(/\.razor$/i, '') + '</h2>\n' : '' });
        activeFile = project.files.length - 1;
        loadActiveFile();
        renderTabs();
      });

      removeButton.addEventListener('click', function () {
        if (project.files.length <= 1) return;
        project.files.splice(activeFile, 1);
        activeFile = Math.max(0, activeFile - 1);
        loadActiveFile();
        renderTabs();
      });

      renderButton.addEventListener('click', renderProject);
      codeEl.addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') renderProject();
      });

      loadActiveFile();
      renderTabs();
      setStatus('downloading runtime…', 'loading');
      runner.ready().then(
        function () {
          renderButton.disabled = false;
          return renderProject();
        },
        function (err) {
          setStatus('failed to start', 'failed');
          diagnosticsEl.textContent = String((err && err.message) || err);
        },
      );
    </script>
  </body>
</html>
